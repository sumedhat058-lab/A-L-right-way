<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Direct Upload Admin</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f7f6; padding: 20px; margin: 0; }
        .form-card { max-width: 450px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0d47a1; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 12px; color: #333; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; background: #1976d2; color: white; border: none; padding: 12px; border-radius: 5px; margin-top: 20px; font-weight: bold; font-size: 15px; cursor: pointer; }
        button:hover { background: #0d47a1; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>📄 GitHub Direct Upload</h2>
        <form id="uploadForm">
            <label>GitHub Personal Access Token</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" required>

            <label>Subject ID</label>
            <input type="text" id="subjectId" placeholder="74" required>

            <label>Type</label>
            <select id="type">
                <option value="Paper">Paper</option>
                <option value="Note">Short Note</option>
            </select>

            <label>Medium</label>
            <select id="medium">
                <option value="Sinhala">Sinhala</option>
                <option value="English">English</option>
            </select>

            <label>Year</label>
            <input type="text" id="year" placeholder="2021" required>

            <label>PDF File</label>
            <input type="file" id="pdfFile" accept="application/pdf" required>

            <button type="submit" id="subBtn">Upload to GitHub</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const USERNAME = 'sumedhat058-lab';
        const REPO = 'A-L-right-way';

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const status = document.getElementById('status');
            const token = document.getElementById('ghToken').value.trim();
            const fileInput = document.getElementById('pdfFile').files[0];

            btn.disabled = true;
            status.style.color = 'blue';
            status.innerText = 'Uploading directly to GitHub...';

            const subjectId = document.getElementById('subjectId').value;
            const type = document.getElementById('type').value;
            const medium = document.getElementById('medium').value;
            const year = document.getElementById('year').value;

            const cleanFileName = fileInput.name.replace(/\s+/g, '_');
            const filePath = `uploads/${subjectId}_${type}_${medium}_${year}_${cleanFileName}`;

            const reader = new FileReader();
            reader.onload = async function() {
                const base64Content = reader.result.split(',')[1];
                const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${filePath}`;

                try {
                    const response = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Add ${type} - ${subjectId} (${year})`,
                            content: base64Content
                        })
                    });

                    if (response.ok) {
                        status.style.color = 'green';
                        status.innerText = 'Uploaded Successfully to GitHub!';
                        document.getElementById('uploadForm').reset();
                    } else {
                        const errData = await response.json();
                        status.style.color = 'red';
                        status.innerText = 'Failed: ' + (errData.message || 'Check Token');
                    }
                } catch (err) {
                    status.style.color = 'red';
                    status.innerText = 'Upload Error occurred!';
                }
                btn.disabled = false;
            };

            reader.readAsDataURL(fileInput);
        });
    </script>
</body>
</html>
