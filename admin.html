<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Help - Admin Upload</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f7f6; padding: 20px; margin: 0; }
        .form-card { max-width: 450px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0d47a1; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 12px; color: #333; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; background: #1976d2; color: white; border: none; padding: 12px; border-radius: 5px; margin-top: 20px; font-weight: bold; font-size: 15px; cursor: pointer; }
        button:hover { background: #0d47a1; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>📄 Add New Paper / Note</h2>
        <form id="uploadForm">
            <label>Subject ID (උදා: 74)</label>
            <input type="text" id="subjectId" required placeholder="74">

            <label>Type</label>
            <select id="type">
                <option value="Paper">Paper</option>
                <option value="Note">Short Note</option>
            </select>

            <label>Medium</label>
            <select id="medium">
                <option value="Sinhala">Sinhala</option>
                <option value="English">English</option>
                <option value="Tamil">Tamil</option>
            </select>

            <label>Year</label>
            <input type="text" id="year" placeholder="2021" required>

            <label>PDF File</label>
            <input type="file" id="pdfFile" accept="application/pdf" required>

            <button type="submit" id="subBtn">Upload Document</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUHoyQmhtjEl-2BWLNhHct70IaINMoq6zsGZogUwS7IApB665f_XoNXWp5cGakheU/exec'; 

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.style.color = 'blue';
            status.innerText = 'Uploading... Please wait!';

            const fileInput = document.getElementById('pdfFile').files[0];
            const reader = new FileReader();

            reader.onload = async function() {
                const payload = {
                    subjectId: document.getElementById('subjectId').value,
                    type: document.getElementById('type').value,
                    medium: document.getElementById('medium').value,
                    year: document.getElementById('year').value,
                    fileName: fileInput.name,
                    fileData: reader.result
                };

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if(data.status === 'success') {
                        status.style.color = 'green';
                        status.innerText = 'Successfully Uploaded!';
                        document.getElementById('uploadForm').reset();
                    } else {
                        status.style.color = 'red';
                        status.innerText = 'Upload Failed! Check script permissions.';
                    }
                } catch(err) {
                    status.style.color = 'red';
                    status.innerText = 'Error occurred during upload!';
                }
                btn.disabled = false;
            };

            reader.readAsDataURL(fileInput);
        });
    </script>
</body>
</html>
