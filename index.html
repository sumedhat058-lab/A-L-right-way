<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Help</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; }
        .header { background: linear-gradient(135deg, #0d47a1, #1976d2); color: white; padding: 30px 15px; text-align: center; }
        .header h1 { font-size: 26px; margin-bottom: 8px; }
        .header p { font-size: 13px; opacity: 0.9; margin-bottom: 18px; }
        .search-box { width: 100%; max-width: 500px; padding: 12px 20px; border: none; border-radius: 25px; font-size: 15px; outline: none; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .container { max-width: 800px; margin: 25px auto; padding: 0 15px; }
        .section-title { font-size: 20px; margin-bottom: 20px; color: #1a237e; border-bottom: 2px solid #1976d2; padding-bottom: 5px; display: inline-block; }
        .subject-card { background: white; border-radius: 10px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .sub-code { font-size: 12px; color: #1976d2; font-weight: bold; text-transform: uppercase; }
        .sub-title { font-size: 17px; font-weight: 600; color: #222; margin: 5px 0 15px 0; }
        .resource-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #eee; padding-top: 12px; }
        .resource-box h4 { font-size: 14px; color: #555; margin-bottom: 8px; }
        .medium-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .medium-btn { text-decoration: none; font-size: 12px; padding: 6px 10px; border-radius: 4px; background-color: #e3f2fd; color: #0d47a1; font-weight: 500; cursor: pointer; border: none; }
        .medium-btn:hover { background-color: #1976d2; color: white; }
        
        /* Modal Popup Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; }
        .modal-header { font-size: 18px; font-weight: bold; color: #0d47a1; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        .close-btn { position: absolute; top: 12px; right: 15px; font-size: 22px; cursor: pointer; color: #888; }
        .year-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .year-btn { padding: 10px; background: #f0f4f8; border: 1px solid #1976d2; color: #0d47a1; font-weight: 600; border-radius: 6px; text-decoration: none; text-align: center; }
        .year-btn:hover { background: #1976d2; color: white; }

        @media (max-width: 600px) { .resource-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

            { id: "66", name: "Bio Systems Technology / ජෛව පද්ධති තාක්ෂණවේදය" },
            { id: "67", name: "Science for Technology / තාක්ෂණවේදය සඳහා විද්‍යාව" },

            { id: "83", name: "Russian / රුසියන්" },
            { id: "84", name: "Hindi / හින්දි" },
            { id: "86", name: "Chinese / චීන" },
            { id: "87", name: "Japanese / ජපන්" },
            { id: "88", name: "Korean / කොරියන්" }
        ];

        const SHEET_ID = '1V5efZ47fyxNjEfKxl6s0_Yhe-wi2nBDxXRtbEa39iLw';
        let pdfData = [];

        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let c of text) {
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(entry.trim().replace(/^"|"$/g, ''));
                    entry = '';
                } else {
                    entry += c;
                }
            }
            result.push(entry.trim().replace(/^"|"$/g, ''));
            return result;
        }

        async function fetchLinks() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`);
                const csvText = await res.text();
                const lines = csvText.split('\n').filter(l => l.trim().length > 0);
                if (lines.length < 2) return;

                const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
                
                pdfData = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = parseCSVLine(lines[i]);
                    let row = {};
                    headers.forEach((h, idx) => {
                        row[h] = values[idx] || '';
                    });
                    pdfData.push(row);
                }
            } catch (e) {
                console.error("CSV Fetch Error:", e);
            }
        }

        function openPDF(subId, type, medium) {
            const cleanTargetId = String(subId).trim().replace(/^0+/, '');
            const targetType = type.toLowerCase().trim();
            const targetMedium = medium.toLowerCase().trim();

            const matches = pdfData.filter(item => {
                const sheetSubId = String(item.subjectid || item.subject || '').trim().replace(/^0+/, '');
                const sheetType = String(item.type || '').toLowerCase().trim();
                const sheetMedium = String(item.medium || '').toLowerCase().trim();
                return sheetSubId === cleanTargetId && sheetType === targetType && sheetMedium === targetMedium;
            });

            if (matches.length === 0) {
                alert("මෙම පාඩමට අදාළ PDF එක තවම එකතු කර නොමැත.");
            } else if (matches.length === 1 && (!matches[0].year || matches[0].year === '')) {
                window.open(matches[0].link, '_blank');
            } else {
                showModal(type, medium, matches);
            }
        }

        function showModal(type, medium, items) {
            const modal = document.getElementById('pdfModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalYearList = document.getElementById('modalYearList');

            modalTitle.innerText = `${medium} ${type} - අවුරුද්ද තෝරන්න`;
            modalYearList.innerHTML = '';

            items.forEach(item => {
                const yearLabel = item.year ? `${item.year} Paper/Note` : 'Open File';
                const a = document.createElement('a');
                a.className = 'year-btn';
                a.href = item.link;
                a.target = '_blank';
                a.innerText = yearLabel;
                modalYearList.appendChild(a);
            });

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('pdfModal').style.display = 'none';
        }

        function displaySubjects(data) {
            const listContainer = document.getElementById('subjectList');
            listContainer.innerHTML = '';
            data.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                    <div class="sub-code">Subject ${sub.id}</div>
                    <div class="sub-title">${sub.name}</div>
                    <div class="resource-section">
                        <div class="resource-box">
                            <h4>📄 Past Papers</h4>
                            <div class="medium-links">
                                <button onclick="openPDF('${sub.id}', 'Paper', 'Sinhala')" class="medium-btn">Sinhala</button>
                                <button onclick="openPDF('${sub.id}', 'Paper', 'Tamil')" class="medium-btn">Tamil</button>
                                <button onclick="openPDF('${sub.id}', 'Paper', 'English')" class="medium-btn">English</button>
                            </div>
                        </div>
                        <div class="resource-box">
                            <h4>📖 Short Notes</h4>
                            <div class="medium-links">
                                <button onclick="openPDF('${sub.id}', 'Note', 'Sinhala')" class="medium-btn">Sinhala</button>
                                <button onclick="openPDF('${sub.id}', 'Note', 'Tamil')" class="medium-btn">Tamil</button>
                                <button onclick="openPDF('${sub.id}', 'Note', 'English')" class="medium-btn">English</button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterSubjects() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = subjects.filter(sub => 
                sub.name.toLowerCase().includes(query) || sub.id.toLowerCase().includes(query)
            );
            displaySubjects(filtered);
        }

        fetchLinks().then(() => displaySubjects(subjects));
    </script>

</html>
